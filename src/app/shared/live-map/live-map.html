@if (ready()) {
  <google-map height="100%" width="100%" [center]="center()" [zoom]="zoom" [options]="options()"
    (mapInitialized)="onMapInitialized($event)">
    @for (marker of markers(); track marker.id) {
      <map-marker [position]="marker.position" [title]="marker.title" [options]="marker.options" />
    }
  </google-map>
  @if (locations.error()) {
    <div class="location-notice location-warning" role="alert">
      {{ locations.error() }} <button type="button" (click)="locations.refresh()">Reintentar</button>
    </div>
  }
  @if (locating()) {
    <p class="location-notice" role="status">Obteniendo tu ubicación…</p>
  } @else if (locationMessage()) {
    <div class="location-notice location-warning" role="status">
      <p>{{ locationMessage() }}</p>
      <button type="button" (click)="requestLocation()">Reintentar</button>
    </div>
  }
} @else if (error()) {
  <p class="map-error">{{ error() }}</p>
} @else {
  <p class="map-error">Cargando mapa…</p>
}
