@if (ready()) {
  <google-map height="100%" width="100%" [center]="center" [zoom]="zoom" [options]="options()">
    @for (marker of markers(); track marker.id) {
      <map-marker [position]="marker.position" [title]="marker.title" [options]="marker.options" />
    }
  </google-map>
} @else if (error()) {
  <p class="map-error">{{ error() }}</p>
} @else {
  <p class="map-error">Cargando mapa…</p>
}
